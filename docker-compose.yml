services:
  backend:
    build:
      context: ./mern-demo
      dockerfile: server/Dockerfile
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/hello"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mern-network

  frontend:
    build:
      context: ./mern-demo/client
      dockerfile: Dockerfile
    container_name: mern-frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mern-network

networks:
  mern-network:
    name: mern-network