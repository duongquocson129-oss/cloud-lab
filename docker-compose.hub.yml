services:
  backend:
    image: ${DOCKERHUB_USERNAME}/mern-backend:${IMAGE_TAG:-1.0}
    container_name: mern-backend-hub
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/hello"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mern-network

  frontend:
    image: ${DOCKERHUB_USERNAME}/mern-frontend:${IMAGE_TAG:-1.0}
    container_name: mern-frontend-hub
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mern-network

networks:
  mern-network:
    name: mern-network-hub